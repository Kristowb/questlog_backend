# ==========================================
# Application
# ==========================================
spring.application.name=QuestLog Backend

# ==========================================
# Server
# ==========================================
server.port=${PORT:8080}

# ==========================================
# Database (Supabase PostgreSQL)
# ==========================================
spring.datasource.url=jdbc:postgresql://aws-1-ap-southeast-2.pooler.supabase.com:5432/postgres
spring.datasource.username=postgres.bmsujeproytvbepekplq
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5

# ==========================================
# JPA / Hibernate
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# RFC 7807 Problem Details
# ==========================================
spring.mvc.problemdetails.enabled=false

# ==========================================
# Jackson
# ==========================================
spring.jackson.default-property-inclusion=non_null

# ==========================================
# Google OAuth
# ==========================================
google.oauth.client-id=${GOOGLE_OAUTH_CLIENT_ID:531228559747-j7173dv83osib4uhn68dvmmgefbi0d37.apps.googleusercontent.com}

# ==========================================
# Stripe
# ==========================================
stripe.api.key=${STRIPE_API_KEY:}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:}

# ==========================================
# Swagger / OpenAPI
# ==========================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

